name: Update fish prices

on:
  workflow_dispatch:
  schedule:
    - cron: "20 0 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch public fish prices
        run: node scripts/update-fish-prices.mjs
      - name: Save changed prices
        run: |
          if git diff --quiet -- docs/fish-prices.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/fish-prices.json
          git commit -m "Update daily fish prices"
          git push
